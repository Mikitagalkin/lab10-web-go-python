syntax = "proto3";

package calculator;

option go_package = "lab10-web-go-python/go-service/proto";

service Calculator {
    rpc Add (AddRequest) returns (AddResponse);
    rpc Multiply (MultiplyRequest) returns (MultiplyResponse);
}

message AddRequest {
    int64 a = 1;
    int64 b = 2;
}

message AddResponse {
    int64 result = 1;
}

message MultiplyRequest {
    int64 a = 1;
    int64 b = 2;
}

message MultiplyResponse {
    int64 result = 1;
}
